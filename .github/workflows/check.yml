name: Source and configuration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements/check.txt
      - run: python -B tools/check_release.py
      - run: python -B src/dexgrasp/sample.py -e Final_base --dry-run
